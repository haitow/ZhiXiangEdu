<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>智享云学 - 在线教育培训平台</title>
	<link rel="shortcut icon" href="../../title.jpg">
	<link rel="stylesheet" href="../../plugins/element-ui/index.css" />
	<link rel="stylesheet" href="../../styles/icon/iconfont.css" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: url('../../back.png') no-repeat center center;
			background-size: cover;
			position: relative;
			overflow: hidden;
		}
		body::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.2);
		}
		.login-container {
			display: flex;
			background: rgba(255, 255, 255, 0.95);
			border-radius: 12px;
			overflow: hidden;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
			width: 800px;
			min-height: 450px;
			position: relative;
			z-index: 1;
		}
		.login-left {
			width: 350px;
			background: url('../../back.png') no-repeat center center;
			background-size: cover;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			padding: 40px;
			position: relative;
		}
		.login-left::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.5));
		}
		.brand-info {
			position: relative;
			z-index: 1;
		}
		.brand-name {
			font-size: 24px;
			font-weight: bold;
			color: #fff;
			margin-bottom: 8px;
			text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
		}
		.brand-slogan {
			font-size: 14px;
			color: rgba(255, 255, 255, 0.9);
			text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
		}
		.login-right {
			flex: 1;
			padding: 50px 40px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			background: #fff;
		}
		.login-header {
			text-align: center;
			margin-bottom: 35px;
		}
		.login-header h2 {
			font-size: 22px;
			color: #333;
			font-weight: 500;
			margin-bottom: 5px;
		}
		.login-form .el-form-item {
			margin-bottom: 20px;
		}
		.login-form .el-input__inner {
			height: 42px;
			line-height: 42px;
			border: 1px solid #dcdfe6;
			border-radius: 6px;
			font-size: 14px;
			transition: all 0.3s;
		}
		.login-form .el-input__inner:focus {
			border-color: #409eff;
		}
		.login-form .el-input__prefix {
			left: 12px;
			color: #c0c4cc;
			font-size: 16px;
		}
		.login-form .el-input--prefix .el-input__inner {
			padding-left: 40px;
		}
		.login-btn {
			width: 100%;
			height: 42px;
			border-radius: 6px;
			font-size: 15px;
			font-weight: 500;
			border: none;
			background: linear-gradient(135deg, #409eff 0%, #66b1ff 100%);
			color: #fff;
			transition: all 0.3s;
		}
		.login-btn:hover,
		.login-btn:focus {
			background: linear-gradient(135deg, #3a8ee6 0%, #409eff 100%);
			color: #fff;
		}
		.login-links {
			display: flex;
			justify-content: space-between;
			margin-top: 15px;
		}
		.login-links a {
			color: #409eff;
			font-size: 13px;
			text-decoration: none;
			cursor: pointer;
		}
		.login-links a:hover {
			color: #66b1ff;
		}
		.login-footer {
			text-align: center;
			margin-top: 30px;
		}
		.login-footer p {
			font-size: 12px;
			color: #999;
		}
	</style>
</head>

<body>
	<div class="login-container">
		<div class="login-left">
			<div class="brand-info">
				<div class="brand-name">智享云学</div>
				<div class="brand-slogan">让优质教育资源触手可及</div>
			</div>
		</div>
		<div class="login-right">
			<div class="login-header">
				<h2>欢迎登录</h2>
			</div>
			<div id="login-app">
				<el-form ref="loginForm" :model="loginForm" :rules="loginRules" class="login-form">
					<el-form-item prop="username">
						<el-input v-model="loginForm.username" type="text" placeholder="请输入账号"
							maxlength="20" prefix-icon="iconfont icon-user" />
					</el-form-item>
					<el-form-item prop="password">
						<el-input v-model="loginForm.password" type="password" placeholder="请输入密码"
							prefix-icon="iconfont icon-lock" maxlength="20" 
							@keyup.enter.native="handleLogin" />
					</el-form-item>
					<el-form-item>
						<el-button :loading="loading" class="login-btn" type="primary"
							@click.native.prevent="handleLogin">
							<span v-if="!loading">马上登录</span>
							<span v-else>登录中...</span>
						</el-button>
					</el-form-item>
				</el-form>
				<div class="login-links">
					<a @click="goRegister">注册</a>
					<a @click="goForgotPassword">忘记密码？</a>
				</div>
			</div>
			<div class="login-footer">
				<p>© 2024 智享云学 All Rights Reserved</p>
			</div>
		</div>
	</div>

	<script src="../../plugins/vue/vue.js"></script>
	<script src="../../plugins/element-ui/index.js"></script>
	<script src="../../plugins/axios/axios.min.js"></script>
	<script src="../../js/request.js"></script>
	<script src="../../js/validate.js"></script>
	<script src="../../api/login.js"></script>

	<script>
		new Vue({
			el: '#login-app',
			data() {
				return {
					loginForm: {
						username: 'admin',
						password: '123456'
					},
					loading: false
				}
			},
			computed: {
				loginRules() {
					const validateUsername = (rule, value, callback) => {
						if (value.length < 1) {
							callback(new Error('请输入用户名'))
						} else {
							callback()
						}
					};
					const validatePassword = (rule, value, callback) => {
						if (value.length < 6) {
							callback(new Error('密码必须在6位以上'))
						} else {
							callback()
						}
					};
					return {
						'username': [{
							'validator': validateUsername,
							'trigger': 'blur'
						}],
						'password': [{
							'validator': validatePassword,
							'trigger': 'blur'
						}]
					}
				}
			},
			methods: {
				async handleLogin() {
					this.$refs.loginForm.validate(async (valid) => {
						if (valid) {
							this.loading = true;
							let res = await loginApi(this.loginForm);
							if (String(res.code) === '1') {
								window.localStorage.setItem('userInfo', JSON.stringify(res.data));
								window.localStorage.setItem('accessToken', res.data.accessToken);
								window.localStorage.setItem('refreshToken', res.data.refreshToken);
								window.location.href = '/back/index.html';
							} else {
								this.$message.error(res.msg);
								this.loading = false;
							}
						}
					})
				},
				goRegister() {
					window.location.href = 'register.html';
				},
				goForgotPassword() {
					window.location.href = 'forgot-password.html';
				}
			}
		})
	</script>
</body>

</html>
