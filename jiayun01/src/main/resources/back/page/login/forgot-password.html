<!DOCTYPE html>
<html lang="zh-CN">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>找回密码 - 智享云学</title>
	<link rel="shortcut icon" href="../../title.jpg">
	<link rel="stylesheet" href="../../plugins/element-ui/index.css" />
	<link rel="stylesheet" href="../../styles/icon/iconfont.css" />
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: url('../../back.png') no-repeat center center;
			background-size: cover;
			position: relative;
			overflow: hidden;
		}
		body::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.2);
		}
		.forgot-container {
			display: flex;
			background: rgba(255, 255, 255, 0.95);
			border-radius: 12px;
			overflow: hidden;
			box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
			width: 800px;
			min-height: 480px;
			position: relative;
			z-index: 1;
		}
		.forgot-left {
			width: 350px;
			background: url('../../back.png') no-repeat center center;
			background-size: cover;
			display: flex;
			flex-direction: column;
			justify-content: flex-end;
			padding: 40px;
			position: relative;
		}
		.forgot-left::before {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.5));
		}
		.brand-info {
			position: relative;
			z-index: 1;
		}
		.brand-name {
			font-size: 24px;
			font-weight: bold;
			color: #fff;
			margin-bottom: 8px;
			text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
		}
		.brand-slogan {
			font-size: 14px;
			color: rgba(255, 255, 255, 0.9);
			text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
		}
		.forgot-right {
			flex: 1;
			padding: 40px;
			display: flex;
			flex-direction: column;
			justify-content: center;
			background: #fff;
		}
		.forgot-header {
			text-align: center;
			margin-bottom: 30px;
		}
		.forgot-header h2 {
			font-size: 22px;
			color: #333;
			font-weight: 500;
			margin-bottom: 5px;
		}
		.forgot-header p {
			font-size: 13px;
			color: #999;
		}
		.forgot-form .el-form-item {
			margin-bottom: 18px;
		}
		.forgot-form .el-input__inner,
		.forgot-form .el-select .el-input__inner {
			height: 40px;
			line-height: 40px;
			border: 1px solid #dcdfe6;
			border-radius: 6px;
			font-size: 14px;
			transition: all 0.3s;
		}
		.forgot-form .el-input__inner:focus,
		.forgot-form .el-select .el-input__inner:focus {
			border-color: #409eff;
		}
		.forgot-form .el-input__prefix {
			left: 12px;
			color: #c0c4cc;
			font-size: 16px;
		}
		.forgot-form .el-input--prefix .el-input__inner {
			padding-left: 40px;
		}
		.forgot-btn {
			width: 100%;
			height: 40px;
			border-radius: 6px;
			font-size: 15px;
			font-weight: 500;
			border: none;
			background: linear-gradient(135deg, #409eff 0%, #66b1ff 100%);
			color: #fff;
			transition: all 0.3s;
		}
		.forgot-btn:hover,
		.forgot-btn:focus {
			background: linear-gradient(135deg, #3a8ee6 0%, #409eff 100%);
			color: #fff;
		}
		.forgot-links {
			text-align: center;
			margin-top: 15px;
		}
		.forgot-links a {
			color: #409eff;
			font-size: 13px;
			text-decoration: none;
			cursor: pointer;
		}
		.forgot-links a:hover {
			color: #66b1ff;
		}
		.forgot-footer {
			text-align: center;
			margin-top: 20px;
		}
		.forgot-footer p {
			font-size: 12px;
			color: #999;
		}
		.step-indicator {
			display: flex;
			justify-content: center;
			margin-bottom: 25px;
		}
		.step {
			display: flex;
			align-items: center;
			color: #999;
			font-size: 13px;
		}
		.step.active {
			color: #409eff;
		}
		.step-num {
			width: 24px;
			height: 24px;
			border-radius: 50%;
			background: #e0e0e0;
			color: #fff;
			display: flex;
			align-items: center;
			justify-content: center;
			margin-right: 6px;
			font-size: 12px;
		}
		.step.active .step-num {
			background: #409eff;
		}
		.step-line {
			width: 60px;
			height: 2px;
			background: #e0e0e0;
			margin: 0 10px;
		}
		.step-line.active {
			background: #409eff;
		}
		.security-info {
			background: #f5f7fa;
			border-radius: 6px;
			padding: 12px;
			margin-bottom: 15px;
		}
		.security-info p {
			font-size: 13px;
			color: #666;
		}
		.security-info .question {
			color: #409eff;
			font-weight: 500;
		}
	</style>
</head>

<body>
	<div class="forgot-container">
		<div class="forgot-left">
			<div class="brand-info">
				<div class="brand-name">智享云学</div>
				<div class="brand-slogan">让优质教育资源触手可及</div>
			</div>
		</div>
		<div class="forgot-right">
			<div class="forgot-header">
				<h2>找回密码</h2>
				<p>通过密保问题重置您的密码</p>
			</div>
			<div id="forgot-app">
				<div class="step-indicator">
					<div class="step" :class="{active: currentStep >= 1}">
						<span class="step-num">1</span>
						<span>验证身份</span>
					</div>
					<div class="step-line" :class="{active: currentStep >= 2}"></div>
					<div class="step" :class="{active: currentStep >= 2}">
						<span class="step-num">2</span>
						<span>重置密码</span>
					</div>
				</div>

				<el-form ref="forgotForm" :model="forgotForm" :rules="forgotRules" class="forgot-form" v-if="currentStep === 1">
					<el-form-item prop="username">
						<el-input v-model="forgotForm.username" type="text" placeholder="请输入用户名"
							maxlength="20" prefix-icon="iconfont icon-user" />
					</el-form-item>
					<el-form-item>
						<el-button class="forgot-btn" type="primary" @click.native.prevent="verifyUser">
							验证身份
						</el-button>
					</el-form-item>
				</el-form>

				<div v-if="currentStep === 2">
					<div class="security-info">
						<p>密保问题：<span class="question">{{ securityQuestion }}</span></p>
					</div>
					<el-form ref="answerForm" :model="answerForm" :rules="answerRules" class="forgot-form">
						<el-form-item prop="securityAnswer">
							<el-input v-model="answerForm.securityAnswer" type="text" placeholder="请输入密保答案"
								maxlength="50" prefix-icon="iconfont icon-answer" />
						</el-form-item>
						<el-form-item>
							<el-button class="forgot-btn" type="primary" @click.native.prevent="verifyAnswer">
								验证答案
							</el-button>
						</el-form-item>
					</el-form>
				</div>

				<el-form ref="resetForm" :model="resetForm" :rules="resetRules" class="forgot-form" v-if="currentStep === 3">
					<el-form-item prop="newPassword">
						<el-input v-model="resetForm.newPassword" type="password" placeholder="请输入新密码"
							prefix-icon="iconfont icon-lock" maxlength="20" />
					</el-form-item>
					<el-form-item prop="confirmPassword">
						<el-input v-model="resetForm.confirmPassword" type="password" placeholder="请确认新密码"
							prefix-icon="iconfont icon-lock" maxlength="20" />
					</el-form-item>
					<el-form-item>
						<el-button :loading="loading" class="forgot-btn" type="primary"
							@click.native.prevent="handleReset">
							<span v-if="!loading">确认重置</span>
							<span v-else>重置中...</span>
						</el-button>
					</el-form-item>
				</el-form>

				<div class="forgot-links">
					<a @click="goLogin">返回登录</a>
				</div>
			</div>
			<div class="forgot-footer">
				<p>© 2024 智享云学 All Rights Reserved</p>
			</div>
		</div>
	</div>

	<script src="../../plugins/vue/vue.js"></script>
	<script src="../../plugins/element-ui/index.js"></script>
	<script src="../../plugins/axios/axios.min.js"></script>
	<script src="../../js/request.js"></script>
	<script src="../../js/validate.js"></script>
	<script src="../../api/login.js"></script>

	<script>
		new Vue({
			el: '#forgot-app',
			data() {
				const validateConfirmPassword = (rule, value, callback) => {
					if (value !== this.resetForm.newPassword) {
						callback(new Error('两次输入的密码不一致'))
					} else {
						callback()
					}
				};
				return {
					currentStep: 1,
					forgotForm: {
						username: ''
					},
					answerForm: {
						securityAnswer: ''
					},
					resetForm: {
						newPassword: '',
						confirmPassword: ''
					},
					securityQuestion: '',
					userId: null,
					loading: false,
					validateConfirmPassword
				}
			},
			computed: {
				forgotRules() {
					return {
						'username': [{
							'required': true,
							'message': '请输入用户名',
							'trigger': 'blur'
						}]
					}
				},
				answerRules() {
					return {
						'securityAnswer': [{
							'required': true,
							'message': '请输入密保答案',
							'trigger': 'blur'
						}]
					}
				},
				resetRules() {
					const validatePassword = (rule, value, callback) => {
						if (value.length < 6) {
							callback(new Error('密码至少6位'))
						} else {
							callback()
						}
					};
					return {
						'newPassword': [{
							'validator': validatePassword,
							'trigger': 'blur'
						}],
						'confirmPassword': [{
							'validator': this.validateConfirmPassword,
							'trigger': 'blur'
						}]
					}
				}
			},
			methods: {
				async verifyUser() {
					this.$refs.forgotForm.validate(async (valid) => {
						if (valid) {
							let res = await getSecurityQuestionApi(this.forgotForm.username);
							if (String(res.code) === '1') {
								this.securityQuestion = res.data;
								this.currentStep = 2;
							} else {
								this.$message.error(res.msg);
							}
						}
					})
				},
				async verifyAnswer() {
					this.$refs.answerForm.validate(async (valid) => {
						if (valid) {
							let res = await verifySecurityAnswerApi({
								username: this.forgotForm.username,
								securityAnswer: this.answerForm.securityAnswer
							});
							if (String(res.code) === '1') {
								this.userId = res.data;
								this.currentStep = 3;
							} else {
								this.$message.error(res.msg);
							}
						}
					})
				},
				async handleReset() {
					this.$refs.resetForm.validate(async (valid) => {
						if (valid) {
							this.loading = true;
							let res = await resetPasswordApi({
								userId: this.userId,
								newPassword: this.resetForm.newPassword
							});
							if (String(res.code) === '1') {
								this.$message.success('密码重置成功，请使用新密码登录');
								setTimeout(() => {
									window.location.href = 'login.html';
								}, 1500);
							} else {
								this.$message.error(res.msg);
								this.loading = false;
							}
						}
					})
				},
				goLogin() {
					window.location.href = 'login.html';
				}
			}
		})
	</script>
</body>

</html>
