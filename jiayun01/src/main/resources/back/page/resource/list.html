<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>资源管理</title>
  <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
  <link rel="stylesheet" href="../../styles/common.css" />
  <link rel="stylesheet" href="../../styles/page.css" />
</head>
<body>
<div id="resource-app">
  <div class="dashboard-container">
    <div class="container">
      <!-- 搜索栏 -->
      <div class="tableBar">
        <el-input v-model="name" placeholder="请输入资源名称" style="width: 250px" clearable @keyup.enter.native="handleQuery"></el-input>
        <el-button type="primary" @click="handleQuery">查询</el-button>
        <el-button type="primary" @click="goUpload">+ 上传资源</el-button>
      </div>

      <!-- 表格 -->
      <el-table :data="tableData" stripe>
        <el-table-column prop="fileName" label="文件名称" min-width="200"></el-table-column>
        <el-table-column prop="fileType" label="文件类型" width="100"></el-table-column>
        <el-table-column label="文件大小" width="120">
          <template slot-scope="scope">
            {{ formatSize(scope.row.fileSize) }}
          </template>
        </el-table-column>
        <el-table-column prop="fileMd5" label="MD5" width="240"></el-table-column>
        <el-table-column label="上传状态" width="100">
          <template slot-scope="scope">
            <el-tag :type="scope.row.uploadStatus === 1 ? 'success' : scope.row.uploadStatus === 0 ? 'warning' : 'danger'">
              {{ scope.row.uploadStatus === 1 ? '已完成' : scope.row.uploadStatus === 0 ? '上传中' : '合并失败' }}
            </el-tag>
          </template>
        </el-table-column>
        <el-table-column prop="createTime" label="上传时间" width="180"></el-table-column>
        <el-table-column label="操作" width="160" align="center">
          <template slot-scope="scope">
            <el-button size="mini" type="text" @click="downloadFile(scope.row)">下载</el-button>
            <el-button size="mini" type="text" style="color: #F56C6C" @click="deleteFile(scope.row.id)">删除</el-button>
          </template>
        </el-table-column>
      </el-table>

      <!-- 分页 -->
      <el-pagination
        class="pageList"
        @size-change="handleSizeChange"
        @current-change="handleCurrentChange"
        :current-page="page"
        :page-sizes="[10, 20, 50]"
        :page-size="pageSize"
        layout="total, sizes, prev, pager, next, jumper"
        :total="total">
      </el-pagination>
    </div>
  </div>
</div>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../js/index.js"></script>
<script src="../../api/resource.js"></script>
<script>
new Vue({
  el: '#resource-app',
  data() {
    return {
      name: '',
      page: 1,
      pageSize: 10,
      total: 0,
      tableData: []
    }
  },
  created() {
    this.init();
  },
  methods: {
    init() {
      getResourcePage({ page: this.page, pageSize: this.pageSize, name: this.name }).then(res => {
        if (res.code === 1) {
          this.tableData = res.data.records;
          this.total = res.data.total;
        }
      });
    },
    handleQuery() {
      this.page = 1;
      this.init();
    },
    handleSizeChange(val) {
      this.pageSize = val;
      this.init();
    },
    handleCurrentChange(val) {
      this.page = val;
      this.init();
    },
    goUpload() {
      window.parent.menuHandle({
        id: '14-1',
        name: '资源上传',
        url: 'page/resource/upload.html'
      }, true);
    },
    downloadFile(row) {
      window.open(`/common/download?name=${row.objectName}`);
    },
    deleteFile(id) {
      this.$confirm('确定删除该资源？', '提示', { type: 'warning' }).then(() => {
        deleteResource(id).then(res => {
          if (res.code === 1) {
            this.$message.success('删除成功');
            this.init();
          } else {
            this.$message.error(res.msg || '删除失败');
          }
        });
      }).catch(() => {});
    },
    formatSize(bytes) {
      if (!bytes) return '0 B';
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
    }
  }
});
</script>
</body>
</html>
